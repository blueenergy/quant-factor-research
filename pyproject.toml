[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-factor-research"
version = "0.1.0"
description = "Factor backtest worker (alpha158 and related factor sets)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pymongo>=4.5",
  "python-dotenv>=1.0.0",
  "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mongomock>=4.1"]

[tool.setuptools]
py-modules = ["factor_db"]
packages = [
  "analysis",
  "analysis.core",
  "analysis.factor",
  "analysis.reporting",
  "observability",
  "tools",
  "tools.workers",
  "utils",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
